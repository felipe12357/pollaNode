  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">{{ title() }}</h2>
        <button type="button" class="modal-close" aria-label="Cerrar modal" (click)="close()">
          ×
        </button>
      </div>

      <div class="modal-body">
        <p>{{ message() }}</p>
      </div>
    </div>
  </div>
